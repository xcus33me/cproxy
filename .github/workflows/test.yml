name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: sing-box
          - runner: windows-latest
            binary: sing-box.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download verified integration engine
        run: go run ./cmd/bundle -engine-only -out .build/engine
      - name: Vet
        run: go vet ./...
      - name: Native tests and real loopback SSH integration
        env:
          CPROXY_TEST_SING_BOX: ${{ github.workspace }}/.build/engine/${{ matrix.binary }}
        run: go test -race ./...
