name: build ready-to-run archives
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build archive with pinned sing-box and licenses
        run: go run ./cmd/bundle -os ${{ matrix.os }} -arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cproxy-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
